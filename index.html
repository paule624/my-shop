<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffefa" />
    <meta name="description" content="Une sélection d'objets utiles et bien pensés pour le quotidien." />
    <title>maison moderne — objets choisis, vie quotidienne</title>
    <!-- Product images come from Unsplash: open the connection early to speed up the LCP image -->
    <!-- Explicit lightweight icon: avoids the browser's default /favicon.ico request (404) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <!-- API origin, injected from .env at build time. crossorigin: fetch() uses CORS, which needs its own connection -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
